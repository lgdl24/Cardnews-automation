<!doctype html>
<meta charset="utf-8">
<!-- [표지 A · 화이트] 흰 바탕, 위 가운데 글자, 아래 제품을 크게. 장식은 바닥 그림자와 은색 가는 선만. 문구는 현재 cards.json 1번 그대로 -->
<link rel="stylesheet" href="../design-reference-review/fonts.css">
<style>
  .card {
    background:
      radial-gradient(ellipse 60% 38% at 50% 92%, #EDE8F2 0%, rgba(237,232,242,0) 100%),
      #FFFFFF;
    color: #26212D;
    text-align: center;
  }
  .pager { position: absolute; right: 88px; top: 76px; font-size: 24px; font-weight: 600; color: #6B6474; }
  .badge {
    position: absolute; left: 300px; right: 300px; top: 104px;
    font-size: 26px; font-weight: 700; letter-spacing: 0.12em; color: #6A4A8C;
  }
  .badge::after { content: ''; display: block; width: 40px; height: 2px; margin: 18px auto 0; background: #BDB6C6; }
  .title {
    position: absolute; left: 88px; right: 88px; top: 176px;
    font-size: 70px; font-weight: 700; line-height: 1.24; letter-spacing: -0.04em;
  }
  .title b { font-weight: 700; color: #5E3D82; }
  .sub { position: absolute; left: 88px; right: 88px; top: 366px; font-size: 28px; font-weight: 500; color: #5A5463; }
  .product {
    position: absolute; left: 50%; bottom: 70px; height: 610px; transform: translateX(-50%);
    filter: drop-shadow(0 24px 22px rgba(60, 40, 85, 0.16));
  }
  .floor { position: absolute; left: 50%; bottom: 62px; width: 340px; height: 30px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(60,40,85,0.20) 0%, rgba(60,40,85,0) 70%); }
</style>
<div class="card">
  <span class="pager">1 / 5</span>
  <div class="badge">SPF50+</div>
  <h1 class="title" data-text>노란 톤은 잡고
<b>화사한 쿨톤으로</b></h1>
  <p class="sub">3중 기능성 워터풀 톤업 선크림(퍼플)</p>
  <div class="floor"></div>
  <img class="product" src="product-trim.png" alt="">
</div>

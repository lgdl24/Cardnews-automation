<!doctype html>
<meta charset="utf-8">
<!-- [표지 B · 라일락] 라일락 바탕, 왼쪽 큰 제목 + 오른쪽 기울인 제품(대각선 구도). 장식은 바닥 그림자만. 문구는 현재 cards.json 1번 그대로 -->
<link rel="stylesheet" href="../design-reference-review/fonts.css">
<style>
  .card {
    background: linear-gradient(165deg, #F4F0F8 0%, #E6DCF0 55%, #D6C8E6 100%);
    color: #241E2C;
  }
  .badge {
    position: absolute; left: 88px; top: 76px; padding: 10px 20px;
    background: #FFFFFF; color: #5B3B80; font-size: 24px; font-weight: 700; letter-spacing: 0.06em;
  }
  .pager { position: absolute; right: 88px; top: 86px; font-size: 24px; font-weight: 600; color: #574F62; }
  .title {
    position: absolute; left: 88px; top: 372px; width: 560px;
    font-size: 84px; font-weight: 800; line-height: 1.2; letter-spacing: -0.045em;
  }
  .title b { display: block; font-weight: 800; color: #55357A; }
  .rule { position: absolute; left: 88px; top: 610px; width: 64px; height: 3px; background: #241E2C; }
  .sub { position: absolute; left: 88px; top: 644px; width: 560px; font-size: 28px; font-weight: 500; line-height: 1.45; color: #463E52; }
  .product {
    position: absolute; right: 120px; top: 236px; height: 640px; transform: rotate(-12deg);
    filter: drop-shadow(-18px 30px 26px rgba(50, 30, 75, 0.22));
  }
  .floor { position: absolute; right: 150px; bottom: 196px; width: 300px; height: 34px; border-radius: 50%; background: radial-gradient(ellipse, rgba(50,30,75,0.22) 0%, rgba(50,30,75,0) 70%); }
</style>
<div class="card">
  <span class="badge">SPF50+</span>
  <span class="pager">1 / 5</span>
  <h1 class="title" data-text>노란 톤은 잡고
<b>화사한 쿨톤으로</b></h1>
  <div class="rule"></div>
  <p class="sub">3중 기능성 워터풀 톤업 선크림(퍼플)</p>
  <div class="floor"></div>
  <img class="product" src="product-trim.png" alt="">
</div>

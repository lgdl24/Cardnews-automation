<style>
/* 팝 · 이미지 강조형: 위는 옅은 색면에 제목·설명, 아래는 보색 띠, 오른쪽에 흰 둥근 상자 안 제품 */
.card.pop-image { padding:64px 72px; background:var(--color-accent); }
.pop-image__band { position:absolute; left:0; right:0; bottom:0; height:400px; background:hsl(from var(--color-primary) calc(h + 150) 65% 74%); }
.pop-image .pager { position:absolute; right:72px; top:64px; }
.pop-image__label { position:absolute; left:72px; top:64px; height:52px; padding:0 26px; border-radius:26px; font-size:26px; font-weight:800; line-height:52px; background:var(--color-text); color:var(--color-surface); }
.pop-image__title { position:absolute; left:72px; top:170px; width:500px; font-size:66px; font-weight:800; line-height:1.26; max-height:250px; color:var(--color-text); }
.pop-image__copy { position:absolute; left:72px; top:460px; width:470px; font-size:34px; font-weight:600; line-height:1.5; max-height:204px; color:var(--color-text); }
.pop-image__frame { position:absolute; right:56px; top:250px; width:420px; height:700px; border-radius:44px; background:var(--color-surface); }
.pop-image__visual { position:absolute; right:86px; top:290px; width:360px; height:620px; }
.pop-image__photo { display:block; width:100%; height:100%; object-fit:contain; }
.pop-image.no-image .pop-image__frame, .pop-image.no-image .pop-image__visual { display:none; }
.pop-image.no-image .pop-image__title, .pop-image.no-image .pop-image__copy { width:936px; }
</style>
<article class="card pop-image role-{{role}} {{imageClass}}">
  <div class="pop-image__band" aria-hidden="true"></div>
  <div class="pop-image__frame" aria-hidden="true"></div>
  <span class="pager">{{page}} / {{total}}</span>
  <div class="pop-image__label">{{sectionLabel}}</div>
  <h1 class="pop-image__title" data-fit>{{title}}</h1>
  <div class="pop-image__copy" data-fit>{{caption}}</div>
  <div class="pop-image__visual"><img class="pop-image__photo" style="{{imageCrop}}" src="{{image}}" alt=""></div>
</article>

<style>
/* 팝 컬러블록 · 이미지 강조형 (시안 06 특징 카드 실측): 위 핑크 63%·아래 라임 37%, 오른쪽 흰 둥근 패널 안 제품,
   왼쪽 짙은 알약 머리말 + 굵은 제목 + 설명 */
.card.pop-image { padding:0; background:var(--color-bg); }
.pop-image__lime { position:absolute; left:0; top:670px; width:1080px; height:410px; background:var(--color-accent-2); }
.pop-image__panel { position:absolute; left:640px; top:195px; width:410px; height:770px; border-radius:52px; background:var(--color-surface); }
.pop-image .pager { position:absolute; right:45px; top:44px; font-size:32px; font-weight:800; color:var(--color-text); }
.pop-image__label { position:absolute; left:67px; top:112px; height:68px; padding:0 40px; border-radius:34px; font-size:40px; font-weight:800; line-height:68px; background:var(--color-text); color:var(--color-surface); }
.pop-image__title { position:absolute; left:70px; top:218px; width:560px; font-size:70px; font-weight:900; line-height:1.36; letter-spacing:-0.02em; max-height:191px; color:var(--color-text); }
.pop-image__copy { position:absolute; left:70px; top:470px; width:550px; font-size:50px; font-weight:500; line-height:1.4; max-height:210px; color:var(--color-text); }
.pop-image__visual { position:absolute; left:690px; top:250px; width:310px; height:660px; }
.pop-image__photo { display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 14px 18px rgb(0 0 0 / .15)); }
.pop-image__texture { display:none; position:absolute; left:842px; top:510px; width:200px; height:440px; object-fit:contain; object-position:left center; }
/* 제형 사진(용도: 제형)이 있으면 시안처럼 패널 안에 제품(왼쪽) + 제형(오른쪽 아래) */
.pop-image.has-texture .pop-image__texture { display:block; }
.pop-image.has-texture .pop-image__visual { left:680px; width:200px; }
.pop-image.no-image.has-texture .pop-image__texture { left:680px; width:340px; object-position:center; }
.pop-image.no-image:not(.has-texture) .pop-image__panel, .pop-image.no-image .pop-image__visual { display:none; }
.pop-image.no-image:not(.has-texture) .pop-image__title, .pop-image.no-image:not(.has-texture) .pop-image__copy { width:940px; }
</style>
<article class="card pop pop-image role-{{role}} {{imageClass}} {{textureClass}}">
  <div class="pop-image__lime" aria-hidden="true"></div>
  <div class="pop-image__panel" aria-hidden="true"></div>
  <span class="pager">{{page}} / {{total}}</span>
  <div class="pop-image__label">{{sectionLabel}}</div>
  <h1 class="pop-image__title" data-fit>{{title}}</h1>
  <div class="pop-image__copy" data-fit>{{caption}}</div>
  <div class="image__frame"><img class="pop-image__texture" src="{{texture}}" alt=""></div>
  <div class="pop-image__visual"><img class="pop-image__photo" style="{{imageCrop}}" src="{{image}}" alt=""></div>
</article>

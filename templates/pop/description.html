<style>
/* 팝 컬러블록 · 설명형 (시안 06 사용법 카드 실측): 위 코랄 면 440px(크림 알약 머리말 + 흰 제목), 아래 크림 면에
   원 번호 세 칸(핑크·라임·코랄) + STEP + 내용, 칸 사이 가는 선. 사진이 있으면 오른쪽 세로로 */
.card.pop-description { padding:0; background:var(--color-accent); }
.pop-description__head { position:absolute; left:0; top:0; width:1080px; height:440px; background:var(--color-primary); }
.pop-description .pager { position:absolute; right:45px; top:44px; font-size:32px; font-weight:800; color:var(--color-text); }
.pop-description__label { position:absolute; left:82px; top:102px; height:68px; padding:0 48px; border-radius:34px; font-size:40px; font-weight:800; line-height:68px; background:var(--color-accent); color:var(--color-text); }
.pop-description__title { position:absolute; left:90px; top:196px; width:920px; font-size:88px; font-weight:900; line-height:1.24; letter-spacing:-0.01em; max-height:219px; color:var(--color-on-primary); }
.pop-description__items { position:absolute; left:40px; top:528px; width:1000px; display:flex; list-style:none; counter-reset:points; }
.pop-description.has-image .pop-description__items { width:820px; }
.pop-description .desc__item { position:relative; flex:1 1 0; min-width:0; height:420px; padding:200px 12px 0; text-align:center; counter-increment:points; }
.pop-description .desc__item + .desc__item { border-left:2px solid rgb(66 0 23 / .08); }
.pop-description .desc__item::before { content:counter(points); position:absolute; left:50%; top:0; width:166px; height:166px; margin-left:-83px; border-radius:50%; font-size:92px; font-weight:900; line-height:166px; color:var(--color-text); background:var(--color-bg); }
.pop-description .desc__item:nth-child(2)::before { background:var(--color-accent-2); }
.pop-description .desc__item:nth-child(3)::before { background:var(--color-primary); }
.pop-description .desc__text { display:block; font-size:44px; font-weight:800; line-height:1.36; max-height:180px; color:var(--color-text); }
.pop-description.role-usage .desc__item { padding-top:268px; }
.pop-description.role-usage .desc__item::after { content:'STEP ' counter(points); position:absolute; left:0; right:0; top:190px; font-size:34px; font-weight:800; letter-spacing:.02em; color:var(--color-text); }
.pop-description__visual { display:none; position:absolute; left:880px; top:488px; width:150px; height:490px; }
.pop-description__photo { display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 12px 16px rgb(0 0 0 / .14)); }
.pop-description.has-image .pop-description__visual { display:block; }
</style>
<article class="card pop pop-description role-{{role}} {{imageClass}}">
  <div class="pop-description__head" aria-hidden="true"></div>
  <span class="pager">{{page}} / {{total}}</span>
  <div class="pop-description__label">{{sectionLabel}}</div>
  <h1 class="pop-description__title" data-fit>{{title}}</h1>
  <ol class="pop-description__items">{{items}}</ol>
  <div class="pop-description__visual"><img class="pop-description__photo" style="{{imageCrop}}" src="{{image}}" alt=""></div>
</article>

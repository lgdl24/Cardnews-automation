<style>
/* 브랜드 무드 · 표지: 카드 전체에 AI 배경(output/ai-bg, 글자·제품 없는 장면, 없으면 브랜드 색 그라데이션),
   오른쪽 아래 실제 제품 사진, 왼쪽 위 반투명 면에 제목·부제. 색은 cards.json brand_mood.palette (대비 4.5는 출력이 맞춤) */
.card.brand { padding:0; background:linear-gradient(160deg, var(--color-bg) 0%, var(--color-accent) 100%); }
.brand__scene { position:absolute; inset:0; overflow:hidden; }
.brand__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .brand__scene-img { display:block; }
.brand__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:2; filter:drop-shadow(0 22px 22px rgb(0 0 0 / .28)); }
.brand__panel { position:absolute; z-index:3; border-radius:28px; background:color-mix(in srgb, var(--color-surface) 90%, transparent); box-shadow:0 12px 36px rgb(0 0 0 / .12); }
.brand .pager { position:absolute; right:40px; top:40px; z-index:4; padding:6px 18px; border-radius:24px; font-size:28px; font-weight:800; color:var(--color-muted); background:color-mix(in srgb, var(--color-surface) 90%, transparent); }
.brand-cover .brand__panel { left:60px; top:60px; width:600px; padding:44px 48px 46px; }
.brand-cover .badge { position:static; display:inline-block; margin-bottom:22px; padding:0 26px; height:56px; border-radius:28px; font-size:30px; font-weight:800; line-height:56px; background:var(--color-primary); color:var(--color-on-primary); }
.brand-cover__title { font-size:66px; font-weight:800; line-height:1.24; letter-spacing:-0.01em; max-height:246px; color:var(--color-text); }
.brand-cover__copy { margin-top:20px; font-size:34px; font-weight:600; line-height:1.36; max-height:93px; color:var(--color-muted); }
.brand-cover__footer { display:none; margin-top:22px; font-size:28px; font-weight:600; color:var(--color-muted); }
/* 부제가 없을 때만 제품명 */
.brand-cover__copy:empty + .brand-cover__footer { display:block; }
.brand-cover .brand__photo { left:560px; top:420px; width:460px; height:600px; }
.brand-cover.no-image .brand__photo { display:none; }
</style>
<article class="card brand brand-cover role-{{role}} {{imageClass}} {{sceneClass}}">
  <div class="brand__scene image__frame" aria-hidden="true"><img class="brand__scene-img" src="{{scene}}" alt=""></div>
  <img class="brand__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <span class="pager">{{page}} / {{total}}</span>
  <div class="brand__panel">
    <span class="badge" data-fit>{{badge}}</span>
    <h1 class="brand-cover__title" data-fit>{{title}}</h1>
    <div class="brand-cover__copy" data-fit>{{subtitle}}</div>
    <div class="brand-cover__footer">{{product}}</div>
  </div>
</article>

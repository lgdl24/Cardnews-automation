<style>
/* 브랜드 무드 · 이미지 강조형: 카드 전체에 AI 배경, 위쪽 가운데 실제 제품 사진(제형 사진이 있으면 제형),
   아래 반투명 면에 'Point N' 머리말·제목·설명 */
.card.brand { padding:0; background:linear-gradient(160deg, var(--color-bg) 0%, var(--color-accent) 100%); }
.brand__scene { position:absolute; inset:0; overflow:hidden; }
.brand__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .brand__scene-img { display:block; }
.brand__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:2; filter:drop-shadow(0 22px 22px rgb(0 0 0 / .28)); }
.brand__panel { position:absolute; z-index:3; border-radius:28px; background:color-mix(in srgb, var(--color-surface) 90%, transparent); box-shadow:0 12px 36px rgb(0 0 0 / .12); }
.brand .pager { position:absolute; right:40px; top:40px; z-index:4; padding:6px 18px; border-radius:24px; font-size:28px; font-weight:800; color:var(--color-muted); background:color-mix(in srgb, var(--color-surface) 90%, transparent); }
.brand-label { font-size:32px; font-weight:800; line-height:1.2; color:var(--color-muted); letter-spacing:0.02em; }
.brand-image .brand__photo { left:290px; top:70px; width:500px; height:500px; }
.brand-image .brand__texture { display:none; position:absolute; left:250px; top:60px; width:580px; height:520px; object-fit:contain; z-index:2; }
.brand-image.has-texture .brand__texture { display:block; }
.brand-image.has-texture .brand__photo { display:none; }
/* 글자 면은 내용만큼, 아래쪽에 붙임 */
.brand-image .brand__panel { left:60px; bottom:60px; width:960px; max-height:400px; padding:40px 52px; box-sizing:border-box; }
.brand-image__title { margin-top:16px; font-size:62px; font-weight:800; line-height:1.24; letter-spacing:-0.01em; max-height:154px; color:var(--color-text); }
.brand-image__copy { margin-top:16px; font-size:38px; font-weight:400; line-height:1.36; max-height:104px; color:var(--color-text); }
.brand-image.no-image .brand__photo { display:none; }
</style>
<article class="card brand brand-image role-{{role}} {{imageClass}} {{sceneClass}} {{textureClass}}">
  <div class="brand__scene image__frame" aria-hidden="true"><img class="brand__scene-img" src="{{scene}}" alt=""></div>
  <img class="brand__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <div class="image__frame"><img class="brand__texture" src="{{texture}}" alt=""></div>
  <span class="pager">{{page}} / {{total}}</span>
  <div class="brand__panel">
    <div class="brand-label">{{sectionLabel}}</div>
    <h1 class="brand-image__title" data-fit>{{title}}</h1>
    <div class="brand-image__copy" data-fit>{{caption}}</div>
  </div>
</article>

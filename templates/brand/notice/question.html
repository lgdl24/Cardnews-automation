<style>
/* 브랜드 무드 · 문제→해결 표지, 알림형 (레퍼런스 notification-reminder): 휴대폰 알림 카드에 문제 제시(title, 규칙 v2 질문),
   아래 'the answer'와 답(subtitle)을 큰 명조로, 오른쪽 아래 제품. 템플릿 question(문제 제시 표지형) 전용, 나머지 카드는 editorial.
   제품 자리는 scripts/lib/brand.js BRAND_LAYOUTS.notice.frames.question과 같게 */
.card.brand { padding:0; background:linear-gradient(160deg, var(--color-bg) 0%, var(--color-accent) 100%); }
.brand__scene { position:absolute; inset:0; overflow:hidden; }
.brand__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .brand__scene-img { display:block; }
.nt__veil { position:absolute; inset:0; z-index:1; background:linear-gradient(90deg, color-mix(in srgb, var(--color-surface) 76%, transparent) 0%, color-mix(in srgb, var(--color-surface) 48%, transparent) 50%, transparent 66%); }
.brand__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:2; filter:drop-shadow(0 26px 24px rgb(0 0 0 / .22)); }
.brand-question .brand__photo { left:620px; top:400px; width:400px; height:620px; }
.brand-question.no-image .brand__photo, .has-baked .brand__photo { display:none; }
.nt__top { position:absolute; left:72px; right:72px; top:58px; z-index:3; display:flex; align-items:center; gap:18px; }
.nt__badge { flex:none; padding:0 22px; height:46px; border:2px solid var(--color-text); border-radius:23px; font-size:24px; font-weight:600; line-height:42px; letter-spacing:.04em; color:var(--color-text); }
.nt__badge:empty { display:none; }
.nt__rule { flex:1; height:1.5px; background:color-mix(in srgb, var(--color-text) 35%, transparent); }
.nt__pager { flex:none; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:28px; color:var(--color-text); }
/* 알림 카드: 반투명 흰 면 + 앱 아이콘(색 네모) + 'now' */
.nt__card { position:absolute; left:72px; top:190px; width:520px; z-index:3; padding:26px 32px 30px; border-radius:34px; background:color-mix(in srgb, var(--color-surface) 92%, transparent); box-shadow:0 18px 40px rgb(0 0 0 / .12); }
.nt__head { display:flex; align-items:center; gap:14px; margin-bottom:16px; font-size:22px; font-weight:600; letter-spacing:.06em; color:var(--color-muted); }
.nt__icon { width:36px; height:36px; border-radius:10px; background:var(--color-primary); }
.nt__now { margin-left:auto; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:24px; letter-spacing:0; }
.nt-cover__title { font-size:42px; font-weight:600; line-height:1.34; letter-spacing:-0.01em; max-height:169px; color:var(--color-text); }
.nt__answer { position:absolute; left:72px; top:560px; width:520px; z-index:3; }
.nt__label { display:flex; align-items:center; gap:16px; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:30px; color:var(--color-primary); }
.nt__label::after { content:''; flex:1; height:1.5px; background:color-mix(in srgb, var(--color-text) 30%, transparent); }
.nt-cover__copy { margin-top:22px; font-family:var(--font-serif), var(--font-family), serif; font-size:58px; font-weight:800; line-height:1.24; letter-spacing:-0.02em; max-height:144px; color:var(--color-text); }
.nt__foot { position:absolute; left:72px; bottom:56px; width:520px; z-index:3; font-size:21px; font-weight:600; letter-spacing:.12em; color:var(--color-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
<article class="card brand brand-question nt role-{{role}} {{imageClass}} {{sceneClass}} {{bakedClass}}">
  <div class="brand__scene image__frame" aria-hidden="true"><img class="brand__scene-img" src="{{scene}}" alt=""></div>
  <div class="nt__veil" aria-hidden="true"></div>
  <img class="brand__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <div class="nt__top"><span class="nt__badge">{{badge}}</span><span class="nt__rule"></span><span class="nt__pager">{{page}} / {{total}}</span></div>
  <div class="nt__card">
    <div class="nt__head"><span class="nt__icon" aria-hidden="true"></span><span>REMINDER</span><span class="nt__now">now</span></div>
    <h1 class="nt-cover__title" data-fit>{{title}}</h1>
  </div>
  <div class="nt__answer">
    <div class="nt__label">the answer</div>
    <div class="nt-cover__copy" data-fit>{{subtitle}}</div>
  </div>
  <div class="nt__foot">{{product}}</div>
</article>

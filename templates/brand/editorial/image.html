<style>
/* 브랜드 무드 · 에디토리얼 이미지 강조형: 위 가운데 큰 영문 세리프 단어 뒤로 제품, 아래는 면 없이 밝게 바랜 장면 위에
   'Point N' 작은 캡션·제목·설명. 제품 자리는 BRAND_LAYOUTS.editorial.frames.image와 같게 */
.card.brand { padding:0; background:linear-gradient(160deg, var(--color-bg) 0%, var(--color-accent) 100%); }
.brand__scene { position:absolute; inset:0; overflow:hidden; }
.brand__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .brand__scene-img { display:block; }
.ed__veil { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, transparent 52%, color-mix(in srgb, var(--color-surface) 78%, transparent) 70%, color-mix(in srgb, var(--color-surface) 90%, transparent) 100%); }
.ed__display { position:absolute; left:0; right:0; top:52px; z-index:3; text-align:center; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:220px; line-height:1; letter-spacing:-0.02em; white-space:nowrap; color:color-mix(in srgb, var(--color-primary) 72%, var(--color-surface)); mix-blend-mode:multiply; }
.brand__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:2; filter:drop-shadow(0 26px 24px rgb(0 0 0 / .22)); }
.brand-image .brand__photo { left:300px; top:150px; width:480px; height:520px; }
.brand-image .brand__texture { display:none; position:absolute; left:270px; top:140px; width:540px; height:530px; object-fit:contain; z-index:2; }
.brand-image.has-texture .brand__texture { display:block; }
.brand-image.has-texture .brand__photo, .brand-image.no-image .brand__photo, .has-baked .brand__photo { display:none; }
.ed__pager { position:absolute; right:72px; top:58px; z-index:3; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:28px; color:var(--color-text); }
.ed__text { position:absolute; left:72px; right:72px; bottom:76px; z-index:3; }
.ed__label { display:flex; align-items:center; gap:18px; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:30px; color:var(--color-primary); }
.ed__label::after { content:''; flex:1; height:1.5px; background:color-mix(in srgb, var(--color-text) 30%, transparent); }
.ed-image__title { margin-top:20px; font-size:60px; font-weight:800; line-height:1.2; letter-spacing:-0.02em; max-height:146px; color:var(--color-text); }
.ed-image__copy { margin-top:16px; font-size:32px; font-weight:300; line-height:1.42; max-height:91px; color:var(--color-text); }
</style>
<article class="card brand brand-image ed role-{{role}} {{imageClass}} {{sceneClass}} {{bakedClass}} {{textureClass}}">
  <div class="brand__scene image__frame" aria-hidden="true"><img class="brand__scene-img" src="{{scene}}" alt=""></div>
  <div class="ed__veil" aria-hidden="true"></div>
  <div class="ed__display" aria-hidden="true">{{display}}</div>
  <img class="brand__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <div class="image__frame"><img class="brand__texture" src="{{texture}}" alt=""></div>
  <span class="ed__pager">{{page}} / {{total}}</span>
  <div class="ed__text">
    <div class="ed__label">{{sectionLabel}}</div>
    <h1 class="ed-image__title" data-fit>{{title}}</h1>
    <div class="ed-image__copy" data-fit>{{caption}}</div>
  </div>
</article>

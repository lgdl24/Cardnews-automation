<style>
/* 브랜드 무드 · 에디토리얼 표지 (레퍼런스 sage-serif-poster·editorial-silk 등): 면 없이 장면 위에 바로 글자.
   큰 영문 세리프 단어(display)가 제품 뒤에 깔리고, 왼쪽 아래 가는 선 + 제목·부제, 위아래 작은 캡션.
   제품 자리는 scripts/lib/brand.js BRAND_LAYOUTS.editorial.frames.cover와 같게 */
.card.brand { padding:0; background:linear-gradient(160deg, var(--color-bg) 0%, var(--color-accent) 100%); }
.brand__scene { position:absolute; inset:0; overflow:hidden; }
.brand__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .brand__scene-img { display:block; }
.ed__veil { position:absolute; inset:0; z-index:1; background:linear-gradient(90deg, color-mix(in srgb, var(--color-surface) 82%, transparent) 0%, color-mix(in srgb, var(--color-surface) 55%, transparent) 42%, transparent 64%); }
.ed__display { position:absolute; left:52px; top:118px; z-index:1; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-weight:400; font-size:220px; line-height:1; letter-spacing:-0.02em; white-space:nowrap; color:color-mix(in srgb, var(--color-primary) 72%, var(--color-surface)); }
.brand__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:2; filter:drop-shadow(0 26px 24px rgb(0 0 0 / .22)); }
.brand-cover .brand__photo { left:560px; top:300px; width:460px; height:720px; }
.brand-cover.no-image .brand__photo, .has-baked .brand__photo { display:none; }
.ed__top { position:absolute; left:72px; right:72px; top:58px; z-index:3; display:flex; align-items:center; gap:18px; }
.ed__badge { flex:none; padding:0 22px; height:46px; border:2px solid var(--color-text); border-radius:23px; font-size:24px; font-weight:600; line-height:42px; letter-spacing:.04em; color:var(--color-text); }
.ed__badge:empty { display:none; }
.ed__rule { flex:1; height:1.5px; background:color-mix(in srgb, var(--color-text) 35%, transparent); }
.ed__pager { flex:none; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:28px; color:var(--color-text); }
.ed__text { position:absolute; left:72px; bottom:118px; width:468px; z-index:3; }
.ed__line { width:64px; height:3px; margin-bottom:30px; background:var(--color-primary); }
.ed-cover__title { font-family:var(--font-serif), var(--font-family), serif; font-size:68px; font-weight:800; line-height:1.18; letter-spacing:-0.02em; max-height:241px; color:var(--color-text); }
.ed-cover__copy { margin-top:24px; font-size:32px; font-weight:300; line-height:1.42; max-height:91px; color:var(--color-text); }
.ed__foot { position:absolute; left:72px; bottom:56px; width:600px; z-index:3; font-size:21px; font-weight:600; letter-spacing:.12em; color:var(--color-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
<article class="card brand brand-cover ed role-{{role}} {{imageClass}} {{sceneClass}} {{bakedClass}}">
  <div class="brand__scene image__frame" aria-hidden="true"><img class="brand__scene-img" src="{{scene}}" alt=""></div>
  <div class="ed__veil" aria-hidden="true"></div>
  <div class="ed__display" aria-hidden="true">{{display}}</div>
  <img class="brand__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <div class="ed__top"><span class="ed__badge">{{badge}}</span><span class="ed__rule"></span><span class="ed__pager">{{page}} / {{total}}</span></div>
  <div class="ed__text">
    <div class="ed__line"></div>
    <h1 class="ed-cover__title" data-fit>{{title}}</h1>
    <div class="ed-cover__copy" data-fit>{{subtitle}}</div>
  </div>
  <div class="ed__foot">{{product}}</div>
</article>

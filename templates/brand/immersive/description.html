<style>
/* 브랜드 무드 · 몰입형 설명형: 어둡게 덮은 장면 위 흰 글자, 이탤릭 번호와 가는 흰 선으로 나눈 항목, 오른쪽 위 작은 제품.
   제품 자리는 BRAND_LAYOUTS.immersive.frames.description과 같게 */
.card.brand { padding:0; background:linear-gradient(170deg, var(--color-text) 0%, color-mix(in srgb, var(--color-text) 70%, var(--color-primary)) 100%); }
.brand__scene { position:absolute; inset:0; overflow:hidden; }
.brand__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .brand__scene-img { display:block; }
.im__veil { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgb(0 0 0 / .3) 0%, rgb(0 0 0 / .62) 34%, rgb(0 0 0 / .7) 100%); }
.im__display { position:absolute; left:64px; top:70px; max-width:700px; z-index:1; overflow:hidden; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:150px; line-height:1; white-space:nowrap; color:rgb(255 255 255 / .9); }
.brand__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:2; filter:drop-shadow(0 20px 18px rgb(0 0 0 / .45)); }
.brand-description .brand__photo { left:800px; top:60px; width:200px; height:240px; }
.brand-description.no-image .brand__photo, .has-baked .brand__photo { display:none; }
.im__pager { position:absolute; right:72px; bottom:22px; z-index:3; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:26px; color:rgb(255 255 255 / .8); }
.im__body { position:absolute; left:72px; right:72px; bottom:64px; z-index:3; }
.im__label { font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:30px; color:rgb(255 255 255 / .85); }
.im-description__title { margin-top:14px; width:700px; font-size:62px; font-weight:800; line-height:1.2; letter-spacing:-0.02em; max-height:149px; color:#fff; }
.im-description__items { margin:34px 0 0; padding:0; list-style:none; counter-reset:points; }
.im .desc__item { display:flex; gap:28px; padding:28px 0; border-top:1.5px solid rgb(255 255 255 / .35); counter-increment:points; }
.im .desc__item::before { content:'0' counter(points); flex:none; width:70px; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:44px; line-height:1.1; color:#fff; }
.im .desc__text { display:block; font-size:38px; font-weight:400; line-height:1.34; max-height:102px; color:#fff; }
</style>
<article class="card brand brand-description im role-{{role}} {{imageClass}} {{sceneClass}} {{bakedClass}}">
  <div class="brand__scene image__frame" aria-hidden="true"><img class="brand__scene-img" src="{{scene}}" alt=""></div>
  <div class="im__veil" aria-hidden="true"></div>
  <div class="im__display" aria-hidden="true">{{display}}</div>
  <img class="brand__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <span class="im__pager">{{page}} / {{total}}</span>
  <div class="im__body">
    <div class="im__label">{{sectionLabel}}</div>
    <h1 class="im-description__title" data-fit>{{title}}</h1>
    <ol class="im-description__items">{{items}}</ol>
  </div>
</article>

<style>
/* 브랜드 무드 · 문제→해결 표지 (레퍼런스 phone-ui-problem-solution): 휴대폰 검색창 모양 상자에 문제 제시(title, 규칙 v2 질문),
   아래 'the answer' 캡션과 답(subtitle)을 큰 명조로, 오른쪽 아래 제품. 이미지·설명형 카드는 editorial 배치를 씀.
   제품 자리는 scripts/lib/brand.js BRAND_LAYOUTS.dialogue.frames.cover와 같게 */
.card.brand { padding:0; background:linear-gradient(160deg, var(--color-bg) 0%, var(--color-accent) 100%); }
.brand__scene { position:absolute; inset:0; overflow:hidden; }
.brand__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .brand__scene-img { display:block; }
.dl__veil { position:absolute; inset:0; z-index:1; background:linear-gradient(90deg, color-mix(in srgb, var(--color-surface) 78%, transparent) 0%, color-mix(in srgb, var(--color-surface) 50%, transparent) 50%, transparent 66%); }
.brand__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:2; filter:drop-shadow(0 26px 24px rgb(0 0 0 / .22)); }
.brand-cover .brand__photo { left:600px; top:380px; width:420px; height:640px; }
.brand-cover.no-image .brand__photo, .has-baked .brand__photo { display:none; }
.dl__top { position:absolute; left:72px; right:72px; top:58px; z-index:3; display:flex; align-items:center; gap:18px; }
.dl__badge { flex:none; padding:0 22px; height:46px; border:2px solid var(--color-text); border-radius:23px; font-size:24px; font-weight:600; line-height:42px; letter-spacing:.04em; color:var(--color-text); }
.dl__badge:empty { display:none; }
.dl__rule { flex:1; height:1.5px; background:color-mix(in srgb, var(--color-text) 35%, transparent); }
.dl__pager { flex:none; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:28px; color:var(--color-text); }
.dl__label { position:absolute; left:84px; z-index:3; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:30px; color:var(--color-muted); }
.dl__label--q { top:170px; }
/* 검색창: 흰 둥근 상자 + 돋보기(원+손잡이) */
.dl__search { position:absolute; left:72px; top:218px; width:520px; z-index:3; display:flex; gap:22px; align-items:flex-start; padding:30px 34px; border-radius:40px; background:var(--color-surface); box-shadow:0 18px 40px rgb(0 0 0 / .12); }
.dl__lens { flex:none; position:relative; width:34px; height:34px; margin-top:8px; border:4px solid var(--color-primary); border-radius:50%; }
.dl__lens::after { content:''; position:absolute; right:-12px; bottom:-10px; width:16px; height:4px; border-radius:2px; background:var(--color-primary); transform:rotate(45deg); }
.dl-cover__title { flex:1; font-size:44px; font-weight:600; line-height:1.34; letter-spacing:-0.01em; max-height:177px; color:var(--color-text); }
.dl__answer { position:absolute; left:72px; top:560px; width:520px; z-index:3; }
.dl__answer .dl__label { position:static; display:flex; align-items:center; gap:16px; color:var(--color-primary); }
.dl__answer .dl__label::after { content:''; flex:1; height:1.5px; background:color-mix(in srgb, var(--color-text) 30%, transparent); }
.dl-cover__copy { margin-top:22px; font-family:var(--font-serif), var(--font-family), serif; font-size:58px; font-weight:800; line-height:1.24; letter-spacing:-0.02em; max-height:144px; color:var(--color-text); }
.dl__foot { position:absolute; left:72px; bottom:56px; width:520px; z-index:3; font-size:21px; font-weight:600; letter-spacing:.12em; color:var(--color-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
<article class="card brand brand-cover dl role-{{role}} {{imageClass}} {{sceneClass}} {{bakedClass}}">
  <div class="brand__scene image__frame" aria-hidden="true"><img class="brand__scene-img" src="{{scene}}" alt=""></div>
  <div class="dl__veil" aria-hidden="true"></div>
  <img class="brand__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <div class="dl__top"><span class="dl__badge">{{badge}}</span><span class="dl__rule"></span><span class="dl__pager">{{page}} / {{total}}</span></div>
  <div class="dl__label dl__label--q">the search</div>
  <div class="dl__search"><span class="dl__lens" aria-hidden="true"></span><h1 class="dl-cover__title" data-fit>{{title}}</h1></div>
  <div class="dl__answer">
    <div class="dl__label">the answer</div>
    <div class="dl-cover__copy" data-fit>{{subtitle}}</div>
  </div>
  <div class="dl__foot">{{product}}</div>
</article>

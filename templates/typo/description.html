<style>
/* 큰 타이포 · 설명형 (시안 10 사용법 카드): 흰 바탕, 제목을 줄마다 폭에 맞춰(최대 170px), 아래 아주 큰 번호(1·2·3)와 오른쪽에 STEP·내용. 모두 강조색. 사진 없음 */
.card.typo { padding:0; background:var(--color-bg); color:var(--color-primary); }
.typo .pager { position:absolute; right:44px; top:36px; font-size:32px; font-weight:800; color:var(--color-primary); }
.typo [data-fit-lines] { padding:24px 0; }
.typo .fit-line { display:table; white-space:nowrap; line-height:1.06; font-weight:900; letter-spacing:-0.01em; }
.typo-description__label { position:absolute; left:60px; top:34px; font-size:42px; font-weight:800; line-height:1.3; color:var(--color-primary); }
.typo-description__title { position:absolute; left:60px; top:98px; width:975px; max-height:380px; color:var(--color-primary); }
.typo-description__items { position:absolute; left:0; top:452px; width:1080px; list-style:none; counter-reset:points; }
.typo-description .desc__item { position:relative; height:196px; padding:20px 50px 0 415px; counter-increment:points; }
.typo-description .desc__item::before { content:counter(points); position:absolute; left:180px; top:4px; width:180px; text-align:center; font-size:230px; font-weight:900; line-height:.84; color:var(--color-primary); }
.typo-description .desc__text { display:block; font-size:58px; font-weight:700; line-height:1.24; max-height:144px; color:var(--color-primary); }
.typo-description.role-usage .desc__item { padding-top:68px; }
.typo-description.role-usage .desc__item::after { content:'STEP ' counter(points); position:absolute; left:415px; top:16px; font-size:38px; font-weight:800; line-height:1.2; color:var(--color-primary); }
</style>
<article class="card typo typo-description role-{{role}} {{imageClass}}">
  <span class="pager">{{page}} / {{total}}</span>
  <div class="typo-description__label">{{sectionLabel}}</div>
  <h1 class="typo-description__title" data-fit data-fit-lines="170,90">{{title}}</h1>
  <ol class="typo-description__items">{{items}}</ol>
</article>

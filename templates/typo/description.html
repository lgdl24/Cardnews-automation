<style>
/* 큰 타이포 · 설명형: 굵은 제목 + 큰 번호 목록 (사용법은 STEP N). 사진 없음 */
.card.typo-description { padding:64px 72px; background:var(--color-surface); }
.typo-description .pager { position:absolute; right:72px; top:64px; }
.typo-description__label { position:absolute; left:72px; top:64px; font-size:30px; font-weight:800; line-height:1.4; color:var(--color-primary); }
.typo-description__title { position:absolute; left:72px; top:150px; width:936px; font-size:84px; font-weight:800; line-height:1.18; letter-spacing:-0.02em; max-height:200px; color:var(--color-primary); }
.typo-description__items { position:absolute; left:72px; top:420px; width:936px; list-style:none; counter-reset:points; }
.typo-description .desc__item { position:relative; min-height:184px; padding:22px 0 22px 170px; counter-increment:points; }
.typo-description .desc__item::before { content:counter(points); position:absolute; left:12px; top:-6px; font-size:150px; font-weight:800; line-height:1; color:var(--color-primary); }
.typo-description .desc__text { display:block; font-size:42px; font-weight:600; line-height:1.4; max-height:118px; color:var(--color-text); }
.typo-description.role-usage .desc__item { padding-top:62px; }
.typo-description.role-usage .desc__item::after { content:'STEP ' counter(points); position:absolute; left:170px; top:18px; font-size:26px; font-weight:800; letter-spacing:.04em; color:var(--color-primary); }
</style>
<article class="card typo-description role-{{role}} {{imageClass}}">
  <span class="pager">{{page}} / {{total}}</span>
  <div class="typo-description__label">{{sectionLabel}}</div>
  <h1 class="typo-description__title" data-fit>{{title}}</h1>
  <ol class="typo-description__items">{{items}}</ol>
</article>

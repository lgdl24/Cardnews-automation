<style>
/* 큰 타이포 (시안 10 '블루 타이프'): 흰 바탕 + 강조색 한 가지. 제목은 줄마다 카드 폭에 맞춰 크기가 정해짐(최대 230px) */
.card.typo { padding:0; background:var(--color-bg); color:var(--color-primary); }
.typo .pager { position:absolute; right:44px; top:36px; font-size:32px; font-weight:800; color:var(--color-primary); }
.typo [data-fit-lines] { padding:24px 0; }
.typo .fit-line { display:table; white-space:nowrap; line-height:1.06; font-weight:900; letter-spacing:-0.01em; }
.typo-cover .badge { position:absolute; left:50px; top:35px; height:70px; max-width:420px; padding:0 34px; border:4px solid var(--color-primary); border-radius:35px; background:transparent; color:var(--color-primary); font-size:38px; font-weight:800; line-height:62px; }
.typo-cover__title { position:absolute; left:50px; top:116px; width:980px; max-height:656px; color:var(--color-primary); }
.typo-cover__copy { position:absolute; left:54px; top:780px; width:640px; font-size:40px; font-weight:800; line-height:1.35; max-height:108px; color:var(--color-primary); }
.typo-cover__visual { position:absolute; right:92px; bottom:30px; width:140px; height:262px; }
.typo-cover__photo { display:block; width:100%; height:100%; object-fit:contain; object-position:center bottom; }
.typo-cover__footer { position:absolute; left:54px; top:968px; font-size:36px; font-weight:800; color:var(--color-primary); }
.typo-cover.no-image .typo-cover__visual { display:none; }
.typo-cover.role-closing { background:var(--color-primary); }
.typo-cover.role-closing .typo-cover__title, .typo-cover.role-closing .typo-cover__copy, .typo-cover.role-closing .typo-cover__footer, .typo-cover.role-closing .pager { color:var(--color-on-primary); }
.typo-cover.role-closing .badge { color:var(--color-on-primary); border-color:var(--color-on-primary); }
</style>
<article class="card typo typo-cover role-{{role}} {{imageClass}}">
  <span class="badge" data-fit>{{badge}}</span><span class="pager">{{page}} / {{total}}</span>
  <h1 class="typo-cover__title" data-fit data-fit-lines="230,110">{{title}}</h1>
  <div class="typo-cover__copy" data-fit>{{subtitle}}</div>
  <div class="typo-cover__visual"><img class="typo-cover__photo" style="{{imageCrop}}" src="{{image}}" alt=""></div>
  <div class="typo-cover__footer">{{product}}</div>
</article>

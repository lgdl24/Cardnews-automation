<!-- 설명형: 제목(필수) · 항목 1~3개(필수)
     디자인: 상자 대신 가는 선으로 나눈 줄. 번호는 표지·이미지 카드와 같은 아치 모양 작은 칸. 줄은 남는 높이에 고르게 놓임 -->
<style>
  .desc__title {
    flex: none;
    margin-top: 44px;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.03em;
    max-height: 160px;           /* 2줄 */
    white-space: pre-line;
  }
  .desc__list {
    list-style: none;
    flex: 1;
    min-height: 0;
    margin: 40px 0 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    counter-reset: item;
  }
  .desc__item {
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 34px 0;
    border-top: 2px solid color-mix(in srgb, var(--color-text) 12%, transparent);
    counter-increment: item;
  }
  .desc__item:last-child { border-bottom: 2px solid color-mix(in srgb, var(--color-text) 12%, transparent); }
  .desc__item::before {
    content: counter(item);
    flex: none;
    width: 76px; height: 92px;
    padding-top: 10px;
    border-radius: 38px 38px 12px 12px;
    background: var(--color-accent);
    color: var(--color-primary);
    font-size: 40px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .desc__text {
    font-size: 38px;
    font-weight: 600;
    line-height: 1.45;
    max-height: 111px;           /* 2줄 */
    white-space: pre-line;
  }
  .card--description .card__footer { margin-top: auto; }
</style>
<div class="card card--description">
  <header class="card__top">
    <span class="badge" data-fit></span>
    <span class="pager">{{page}} / {{total}}</span>
  </header>
  <h2 class="desc__title" data-fit>{{title}}</h2>
  <ol class="desc__list">{{items}}</ol>
  <footer class="card__footer">{{product}}</footer>
</div>

<style>
.card.premium-image { padding:72px; background:var(--color-surface); }
.premium-image__plane { position:absolute; inset:0 auto 0 0; width:540px; background:linear-gradient(160deg,var(--color-bg),var(--color-accent)); }
.premium-image__visual { position:absolute; left:76px; top:230px; width:380px; height:720px; transform:rotate(-6deg); }
.premium-image__photo { display:block; width:100%; height:100%; object-fit:contain; }
.premium-image__label { position:absolute; left:72px; top:96px; padding:10px 18px; font-size:22px; line-height:1.4; font-weight:600; background:var(--color-primary); color:var(--color-on-primary); }
.premium-image__title { position:absolute; left:608px; top:230px; width:400px; font-size:52px; font-weight:800; line-height:1.3; max-height:210px; color:var(--color-primary); }
.premium-image__title::first-line { color:var(--color-text); }
.premium-image__copy { position:absolute; left:608px; top:510px; width:400px; padding-top:28px; border-top:1px solid var(--color-primary); font-size:30px; line-height:1.6; max-height:365px; color:var(--color-text); }
.premium-image .pager { position:absolute; right:72px; top:34px; }
.premium-image.no-image .premium-image__visual { display:none; }
</style>
<article class="card premium-image role-{{role}} {{imageClass}}">
  <div class="premium-image__plane" aria-hidden="true"></div>
  <span class="pager">{{page}} / {{total}}</span>
  <div class="premium-image__label">{{sectionLabel}}</div>
  <div class="premium-image__visual"><img class="premium-image__photo" style="{{imageCrop}}" src="{{image}}" alt=""></div>
  <h1 class="premium-image__title" data-fit>{{title}}</h1>
  <div class="premium-image__copy" data-fit>{{caption}}</div>
</article>

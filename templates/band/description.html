<style>
/* 위쪽 연출 띠 · 설명형 (시안 02 사용법 카드 실측): 위 300px 얇은 장면 띠(제품 오른쪽), 아래 'How to ——',
   남색 제목 2줄, 번호 상자(하늘색 둥근 사각형) + STEP N + 내용 2줄씩 세로로 */
.card.band { padding:0; background:var(--color-bg); }
.band__scene { position:absolute; left:0; top:0; width:1080px; overflow:hidden;
  background:
    radial-gradient(22% 14% at 18% 34%, rgb(255 255 255 / .42), transparent 72%),
    radial-gradient(16% 10% at 84% 44%, rgb(255 255 255 / .38), transparent 72%),
    radial-gradient(60% 26% at 50% 88%, var(--color-scene-light), transparent 72%),
    linear-gradient(180deg, var(--color-scene-deep) 0%, var(--color-scene-mid) 58%, var(--color-scene-light) 100%); }
.band__scene-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.has-scene .band__scene-img { display:block; }
.band__scene::after { content:""; position:absolute; left:0; right:0; bottom:0; height:var(--band-fade, 140px); background:linear-gradient(to bottom, transparent, var(--color-bg)); }
.band__photo { position:absolute; display:block; object-fit:contain; object-position:center bottom; z-index:1; filter:drop-shadow(0 22px 26px rgb(0 0 0 / .32)); }
.band .pager { position:absolute; right:35px; top:38px; font-size:36px; font-weight:800; color:#FFFFFF; z-index:3; }
.band-label { position:absolute; display:flex; align-items:center; gap:36px; font-size:44px; font-weight:800; line-height:1.2; color:var(--color-primary); z-index:2; }
.band-label::after { content:""; width:100px; height:3px; background:var(--color-primary); }
.band-description .band__scene { height:320px; --band-fade:90px; }
.band-description .band__photo { left:540px; top:52px; width:320px; height:228px; }
.band-description .band-label { left:112px; top:352px; font-size:40px; }
.band-description__title { position:absolute; left:112px; top:418px; width:900px; font-size:72px; font-weight:800; line-height:1.25; letter-spacing:-0.01em; max-height:180px; color:var(--color-text); z-index:2; }
.band-description__items { position:absolute; left:112px; top:632px; width:910px; list-style:none; counter-reset:points; }
.band-description .desc__item { position:relative; min-height:120px; padding:0 0 0 130px; counter-increment:points; }
.band-description .desc__item::before { content:counter(points); position:absolute; left:0; top:6px; width:80px; height:80px; border-radius:14px; font-size:44px; font-weight:800; line-height:80px; text-align:center; background:var(--color-primary); color:var(--color-on-primary); }
.band-description .desc__text { display:block; padding-top:0; font-size:40px; font-weight:400; line-height:1.3; max-height:104px; color:var(--color-text); }
.band-description.role-usage .desc__item { padding-left:320px; }
.band-description.role-usage .desc__item::after { content:'STEP ' counter(points); position:absolute; left:130px; top:24px; font-size:36px; font-weight:800; color:var(--color-primary); }
.band-description.no-image .band__photo { display:none; }
</style>
<article class="card band band-description role-{{role}} {{imageClass}} {{sceneClass}}">
  <div class="band__scene image__frame" aria-hidden="true"><img class="band__scene-img" src="{{scene}}" alt=""></div>
  <img class="band__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <span class="pager">{{page}} / {{total}}</span>
  <div class="band-label">{{sectionLabel}}</div>
  <h1 class="band-description__title" data-fit>{{title}}</h1>
  <ol class="band-description__items">{{items}}</ol>
</article>

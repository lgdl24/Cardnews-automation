<style>
/* 위쪽 연출 띠 · 설명형: 띠를 얇게(사진이 있을 때만), 아래에 번호 상자 목록 (사용법은 STEP N) */
.card.band-description { padding:64px 72px; background:var(--color-surface); }
.band__scene { position:absolute; left:0; right:0; top:0; overflow:hidden;
  background:
    radial-gradient(42% 38% at 50% 46%, rgb(255 255 255 / .28), transparent 72%),
    radial-gradient(70% 50% at 18% 8%, hsl(from var(--color-primary) h s 62% / .55), transparent 70%),
    linear-gradient(170deg, hsl(from var(--color-primary) h s 26%), hsl(from var(--color-primary) h s 46%)); }
.band__scene::after { content:''; position:absolute; left:0; right:0; bottom:0; height:120px; background:linear-gradient(to bottom, transparent, var(--color-surface)); }
.band__photo { position:absolute; display:block; object-fit:contain; z-index:1; filter:drop-shadow(0 18px 24px rgb(0 0 0 / .32)); }
.band-description .band__scene { height:300px; }
.band-description .band__photo { left:390px; top:30px; width:300px; height:240px; }
.band-description .pager { position:absolute; right:72px; top:64px; z-index:2; color:var(--color-on-primary); }
.band-description__label { position:absolute; left:72px; top:310px; font-size:28px; font-weight:800; line-height:1.4; color:var(--color-primary); z-index:2; }
.band-description__title { position:absolute; left:72px; top:366px; width:936px; font-size:58px; font-weight:800; line-height:1.26; max-height:147px; color:var(--color-text); z-index:2; }
.band-description__items { position:absolute; left:72px; top:550px; width:936px; list-style:none; counter-reset:points; }
.band-description .desc__item { position:relative; min-height:150px; padding:18px 0 18px 110px; border-top:1px solid var(--color-accent); counter-increment:points; }
.band-description .desc__item::before { content:counter(points); position:absolute; left:0; top:22px; width:76px; height:76px; border-radius:16px; font-size:40px; font-weight:800; line-height:76px; text-align:center; background:var(--color-primary); color:var(--color-on-primary); }
.band-description .desc__text { display:block; font-size:34px; font-weight:400; line-height:1.45; max-height:99px; color:var(--color-text); }
.band-description.role-usage .desc__item { padding-left:300px; }
.band-description.role-usage .desc__item::after { content:'STEP ' counter(points); position:absolute; left:110px; top:42px; font-size:26px; font-weight:800; letter-spacing:.04em; color:var(--color-primary); }
.band-description.no-image .band__scene, .band-description.no-image .band__photo { display:none; }
.band-description.no-image .pager { color:var(--color-muted); }
.band-description.no-image .band-description__label { top:64px; }
.band-description.no-image .band-description__title { top:130px; }
.band-description.no-image .band-description__items { top:330px; }
.band-description.no-image .desc__item { min-height:200px; }
</style>
<article class="card band-description role-{{role}} {{imageClass}}">
  <div class="band__scene" aria-hidden="true"></div>
  <img class="band__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <span class="pager">{{page}} / {{total}}</span>
  <div class="band-description__label">{{sectionLabel}}</div>
  <h1 class="band-description__title" data-fit>{{title}}</h1>
  <ol class="band-description__items">{{items}}</ol>
</article>

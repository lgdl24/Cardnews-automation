<style>
/* 위쪽 연출 띠 · 이미지 강조형: 띠 높이 절반, 아래에 머리말·제목·설명 */
.card.band-image { padding:64px 72px; background:var(--color-surface); }
.band__scene { position:absolute; left:0; right:0; top:0; overflow:hidden;
  background:
    radial-gradient(42% 38% at 50% 46%, rgb(255 255 255 / .28), transparent 72%),
    radial-gradient(70% 50% at 18% 8%, hsl(from var(--color-primary) h s 62% / .55), transparent 70%),
    linear-gradient(170deg, hsl(from var(--color-primary) h s 26%), hsl(from var(--color-primary) h s 46%)); }
.band__scene::after { content:''; position:absolute; left:0; right:0; bottom:0; height:160px; background:linear-gradient(to bottom, transparent, var(--color-surface)); }
.band__photo { position:absolute; display:block; object-fit:contain; z-index:1; filter:drop-shadow(0 24px 30px rgb(0 0 0 / .35)); }
.band-image .band__scene { height:520px; }
.band-image .band__photo { left:290px; top:60px; width:500px; height:430px; }
.band-image .pager { position:absolute; right:72px; top:64px; z-index:2; color:var(--color-on-primary); }
.band-image__label { position:absolute; left:72px; top:540px; font-size:28px; font-weight:800; line-height:1.4; color:var(--color-primary); z-index:2; }
.band-image__title { position:absolute; left:72px; top:600px; width:936px; font-size:60px; font-weight:800; line-height:1.26; max-height:152px; color:var(--color-text); z-index:2; }
.band-image__copy { position:absolute; left:72px; top:790px; width:936px; font-size:34px; font-weight:400; line-height:1.5; max-height:204px; color:var(--color-text); z-index:2; }
.band-image.no-image .band__photo { display:none; }
</style>
<article class="card band-image role-{{role}} {{imageClass}}">
  <div class="band__scene" aria-hidden="true"></div>
  <img class="band__photo" style="{{imageCrop}}" src="{{image}}" alt="">
  <span class="pager">{{page}} / {{total}}</span>
  <div class="band-image__label">{{sectionLabel}}</div>
  <h1 class="band-image__title" data-fit>{{title}}</h1>
  <div class="band-image__copy" data-fit>{{caption}}</div>
</article>

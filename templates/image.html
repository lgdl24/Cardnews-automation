<!-- 이미지 강조형: 이미지(필수) · 제목(필수) · 설명(선택)
     디자인: 위쪽이 둥근 아치 창(표지와 같은 모양) 안에 제품을 크게, 바닥 그림자. 아래 제목·설명 -->
<style>
  .image__frame {
    flex: 1;
    min-height: 0;
    position: relative;
    margin: 24px 0 44px;
    border-radius: 444px 444px 32px 32px;
    background: linear-gradient(180deg, var(--color-accent) 0%, color-mix(in srgb, var(--color-accent) 60%, var(--color-surface)) 100%);
    overflow: hidden;
  }
  .image__frame::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 22px;
    width: 420px; height: 50px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--color-text) 22%, transparent), transparent);
  }
  .image__frame img {
    position: absolute;
    left: 0; right: 0; top: 44px; bottom: 40px;
    width: 100%;
    height: calc(100% - 84px);
    object-fit: contain;
    object-position: center bottom;
    z-index: 1;
  }
  .image__title {
    flex: none;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.03em;
    max-height: 160px;           /* 2줄 */
    white-space: pre-line;
  }
  .image__caption {
    flex: none;
    margin-top: 18px;
    margin-bottom: 36px;
    font-size: 34px;
    line-height: 1.5;
    color: var(--color-muted);
    max-height: 102px;           /* 2줄 */
    white-space: pre-line;
  }
</style>
<div class="card card--image {{imageClass}}">
  <header class="card__top">
    <span class="badge" data-fit></span>
    <span class="pager">{{page}} / {{total}}</span>
  </header>
  <div class="image__frame"><img style="{{imageCrop}}" src="{{image}}" alt=""></div>
  <h2 class="image__title" data-fit>{{title}}</h2>
  <p class="image__caption" data-fit>{{caption}}</p>
  <footer class="card__footer">{{product}}</footer>
</div>

<!-- 이미지 강조형: 이미지(필수) · 제목(필수) · 설명(선택) -->
<style>
  .image__frame {
    flex: 1;
    min-height: 0;
    margin: 32px 0 44px;
    border-radius: 36px;
    background: var(--color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .image__frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 40px;
  }
  .image__title {
    flex: none;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.03em;
    max-height: 160px;           /* 2줄 */
    white-space: pre-line;
  }
  .image__caption {
    flex: none;
    margin-top: 20px;
    margin-bottom: 36px;
    font-size: 34px;
    line-height: 1.5;
    color: var(--color-muted);
    max-height: 102px;           /* 2줄 */
    white-space: pre-line;
  }
</style>
<div class="card card--image {{imageClass}}">
  <header class="card__top">
    <span class="badge" data-fit></span>
    <span class="pager">{{page}} / {{total}}</span>
  </header>
  <div class="image__frame"><img src="{{image}}" alt=""></div>
  <h2 class="image__title" data-fit>{{title}}</h2>
  <p class="image__caption" data-fit>{{caption}}</p>
  <footer class="card__footer">{{product}}</footer>
</div>
